{% extends 'mailing_app/base.html' %}

{% block content %}
<h1>Вход на сайт</h1>

<form method="post" enctype="multipart/form-data">
    {% csrf_token %}
    {{ form.as_p }}

    {% if form.errors %}
    <div class="alert alert-danger">
        {{ form.errors }}
    </div>
    {% endif %}

    <button type="submit" class="btn btn-primary">Войти</button>
    <a href="{% url 'mailing_app:home' %}" class="btn btn-secondary">Отмена</a>
</form>
{% endblock %}
