{% extends 'mailing_app/base.html' %}

{% block content %}
<div class="container mt-4">
    <h1>{% if view.object %}Редактировать рассылку{% else %}Добавить рассылку{% endif %}</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% include 'mailing_app/form_fields.html' with form=form %}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'mailing_app:mailing_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
