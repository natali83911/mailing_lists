{% extends 'mailing_app/base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<h1>Удаление сообщения</h1>
<p>Вы уверены, что хотите удалить сообщение: <strong>{{ object.subject }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить удаление</button>
    <a href="{% url 'mailing_app:message_list' %}">Отмена</a>
</form>
{% endblock %}
