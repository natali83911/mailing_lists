{% extends 'mailing_app/base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<h1>Удаление рассылки</h1>
<p>Вы уверены, что хотите удалить рассылку: <strong>{{ object }}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить удаление</button>
    <a href="{% url 'mailing_app:mailing_list' %}">Отмена</a>
</form>
{% endblock %}
