{% extends 'mailing_app/base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<h1>Удаление клиента</h1>
<p>Вы уверены, что хотите удалить клиента: <strong>{{ object.full_name }} ({{ object.email }})</strong>?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit">Подтвердить удаление</button>
    <a href="{% url 'mailing_app:client_list' %}">Отмена</a>
</form>
{% endblock %}
